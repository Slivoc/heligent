[Service]
# The web process also runs the sequential ingestion worker. Under contention,
# preserve capacity for the production CRM and prefer terminating this process.
CPUWeight=25
IOWeight=25
Nice=10
MemoryHigh=2G
MemoryMax=3G
OOMScoreAdjust=500
TasksMax=256
LogRateLimitIntervalSec=30s
LogRateLimitBurst=1000
