[Service]
# Keep the local product API responsive without allowing it to crowd out CRM.
CPUWeight=50
IOWeight=50
MemoryHigh=768M
MemoryMax=1G
OOMScoreAdjust=250
TasksMax=128
LogRateLimitIntervalSec=30s
LogRateLimitBurst=1000
ExecStart=
ExecStart=/srv/heligent/.venv/bin/heligent-intelligence-api --host 127.0.0.1 --port 5100 --threads 4
